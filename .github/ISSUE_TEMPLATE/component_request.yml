name: Block request
description: Propose an expressive block for a real page
labels: [component request]
body:
  - type: markdown
    attributes:
      value: |
        Gear5 focuses on expressive React blocks for portfolios and product
        launches. Describe the page this block helps someone build and the
        interaction that makes it useful.
  - type: input
    id: name
    attributes:
      label: Proposed name
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What page or use case does it enable?
      description: Include a concrete example and the content someone would supply.
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: What interaction and responsive behaviour should it have?
    validations:
      required: true
